# NGINX gateway for the catarig Mini Banking System (Tipon).
# These two blocks go INSIDE the shared `server { listen 8000; ... }` in
# /etc/nginx/sites-available/ipt2 on the Ubuntu server (the /catarig/ API block
# is already there; add the /catarig-wui/ block next to it).
#
#   http://<server>:8000/catarig/      -> FastAPI (uvicorn on 127.0.0.1:5000)
#   http://<server>:8000/catarig-wui/  -> the built Quasar web app (static files)
#
# Every client (browser, Android app) uses these URLs; uvicorn listens on
# 127.0.0.1 only, so nothing can reach it except through NGINX.

    location /catarig/ {
        proxy_pass http://127.0.0.1:5000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Prefix /catarig;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /catarig-wui/ {
        alias /var/www/catarig-wui/;
        index index.html;
        # index.html is never cached, so a new build shows up on the next reload
        location = /catarig-wui/index.html {
            alias /var/www/catarig-wui/index.html;
            add_header Cache-Control "no-store";
        }
    }

# NGINX: serve the built catarig web app (Tipon) at /catarig-wui/.
#
# Install on the Ubuntu server as /etc/nginx/snippets/catarig-wui.conf and
# include it inside the shared `server { listen 8000; ... }` block in
# /etc/nginx/sites-available/ipt2 (which already has the API proxy:
# location /catarig/ { proxy_pass http://127.0.0.1:5000/; ... }).
#
#   http://<server>:8000/catarig/      -> FastAPI (uvicorn on 127.0.0.1:5000)
#   http://<server>:8000/catarig-wui/  -> this: the built Quasar web app
#
# Every client (browser, Android app) uses these two URLs; uvicorn listens on
# 127.0.0.1 only, so nothing reaches it except through NGINX.

location /catarig-wui/ {
    alias /var/www/catarig-wui/;
    index index.html;
}

# index.html is never cached, so a new build shows up on the next reload.
location = /catarig-wui/index.html {
    alias /var/www/catarig-wui/index.html;
    add_header Cache-Control "no-store";
}

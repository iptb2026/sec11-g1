; FastAPI backend as a service on the Ubuntu server, run by supervisor
; (which already runs MySQL there). Copy to /etc/supervisor/conf.d/ then:
;   supervisorctl reread && supervisorctl update
;   supervisorctl status catarig-api
;
; - Listens on 127.0.0.1 only: clients must go through NGINX (:8000/catarig/).
; - --root-path /catarig: the API sits under /catarig/ behind NGINX, so /docs
;   (and its Authorize button) work at http://<server>:8000/catarig/docs.
; - Reads its settings from appserver/.env (DB password, SECRET_KEY).

[program:catarig-api]
command=/opt/virt/bin/uvicorn app.main:app --host 127.0.0.1 --port 5000 --root-path /catarig
directory=/home/admin/deploy/Banking system/appserver
user=admin
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/var/log/supervisor/catarig-api.log

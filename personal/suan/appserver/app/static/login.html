<!DOCTYPE html>
<html>
<head>
  <title>Mini Bank — Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #0f2540 0%, #1a3a5c 100%);
      min-height: 100vh;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      background: #ffffff;
      width: 100%;
      max-width: 380px;
      padding: 40px 36px;
      border-radius: 12px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.25);
    }
    .logo {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: #0f2540;
      color: #fff;
      font-size: 24px;
      font-weight: 700;
      margin: 0 auto 16px;
    }
    h2 {
      text-align: center;
      margin: 0 0 4px;
      font-size: 20px;
      color: #0f2540;
    }
    .subtitle {
      text-align: center;
      color: #6b7280;
      font-size: 13px;
      margin: 0 0 28px;
    }
    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #374151;
      margin-bottom: 6px;
    }
    input {
      width: 100%;
      padding: 11px 12px;
      margin-bottom: 18px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 14px;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    input:focus {
      outline: none;
      border-color: #0f2540;
      box-shadow: 0 0 0 3px rgba(15,37,64,0.1);
    }
    button {
      width: 100%;
      padding: 12px;
      background: #0f2540;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }
    button:hover { background: #16385c; }
    button:active { transform: translateY(1px); }
    #error {
      color: #dc2626;
      font-size: 13px;
      text-align: center;
      margin-top: 14px;
      min-height: 16px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">🏦</div>
    <h2>Mini Banking System</h2>
    <p class="subtitle">Sign in to your account</p>

    <label for="username">Username</label>
    <input id="username" placeholder="Enter your username" autocomplete="username">

    <label for="password">Password</label>
    <input id="password" type="password" placeholder="Enter your password" autocomplete="current-password">

    <button onclick="login()">Log In</button>
    <p id="error"></p>
  </div>

  <script>
    async function login() {
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      const res = await fetch('/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });
      if (!res.ok) {
        document.getElementById('error').innerText = 'Invalid credentials';
        return;
      }
      const data = await res.json();
      sessionStorage.setItem('token', data.token);
      sessionStorage.setItem('role', data.role);
      sessionStorage.setItem('username', data.username);
      sessionStorage.setItem('user_id', data.user_id);
      window.location.href = '/static/dashboard.html';
    }
  </script>
</body>
</html>
